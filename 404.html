<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — TunnelX</title>
<!--
  A Vercel serve este arquivo para qualquer endereco desconhecido. Sem ele, o
  visitante recebe a pagina padrao da hospedagem e o Google pode registrar um
  "soft 404" — uma pagina de erro que responde como se estivesse tudo certo.
-->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#05080F">
<link rel="shortcut icon" href="/img/favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>document.documentElement.className += " js";</script>
<!-- A classe acima liga o estado escondido das secoes que entram animadas.
     Ela e posta ANTES da folha de estilo justamente para nao haver um quadro
     com o conteudo visivel antes de sumir. Sem JS, a classe nunca aparece e a
     pagina e exibida inteira. -->
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="cabecalho">
    <div class="container nav">
        <a href="/" class="marca">
            <img src="/img/logo-mark-96.png" alt="" width="34" height="34">
            <span>TunnelX</span>
        </a>
        <a class="botao botao--principal nav-cta" href="https://play.google.com/store/apps/details?id=com.tunnelxapp" target="_blank" rel="noopener">Baixar o app</a>
    </div>
</header>

<main class="legal">
    <div class="container">
        <div class="legal-cabeca">
            <p class="olho" style="justify-content:center">Erro 404</p>
            <h1>Essa página não existe.</h1>
            <p>O endereço pode ter mudado de lugar, ou o link que te trouxe até aqui está errado.</p>
        </div>

        <div class="legal-acoes" style="justify-content:center">
            <a href="/" class="botao botao--fantasma">Ir para o início</a>
            <a class="botao botao--principal" href="https://play.google.com/store/apps/details?id=com.tunnelxapp" target="_blank" rel="noopener">Baixar o app</a>
        </div>
    </div>
</main>

<footer class="rodape">
    <div class="container">
        <div class="rodape-fim">
            <p>&copy; <span id="ano">2026</span> TunnelX. Todos os direitos reservados.</p>
            <p><a href="/politica-de-privacidade.html">Política de Privacidade</a></p>
        </div>
    </div>
</footer>

<script src="/js/main.js"></script>
</body>
</html>
