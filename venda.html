<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura — TunnelX</title>
    <!-- Esta pagina so embute o checkout que mora em outro dominio. Indexada,
         ela aparece na busca como uma pagina vazia e disputa as mesmas
         palavras da pagina principal. -->
    <!-- Sem rel=canonical junto: noindex mais canonical para outra URL e
         combinacao desaconselhada pelo Google — o noindex pode ser
         transportado para o destino. O "follow" ja passa os links adiante. -->
    <meta name="robots" content="noindex, follow">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://admin.tunnelx.com.br/pre-cadastro.html" title="Pré-cadastro TunnelX"></iframe>
</body>
</html>
